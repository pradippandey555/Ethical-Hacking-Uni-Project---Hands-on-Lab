# Nmap Configuration File
# Usage: nmap -c nmap-config.conf target
# Or import settings into Zenmap

# Basic scanning preferences
--min-hostgroup 1
--max-hostgroup 1024
--min-parallelism 0
--max-parallelism 0

# Default timing
--host-timeout 30m
--scan-delay 0
--max-scan-delay 5

# Verbosity
--verbose

# Default ports
--top-ports 1000

# Service/version detection
--version-all

# OS Detection options
--osscan-limit
--osscan-guess

# NSE scripting
--script default
--script-trace

# Output
--log-errors

# Disable reverse DNS
-n

# Min rate (packets per second)
--min-rate 0
--max-rate 0