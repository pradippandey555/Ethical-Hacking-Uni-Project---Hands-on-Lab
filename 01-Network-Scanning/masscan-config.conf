# Masscan Configuration File
# Ultra-fast network scanner
# Usage: masscan -c masscan-config.conf

# Basic options
rate = 1000.00
randomize-targets = true
randomize-ports = true

# Ports to scan
ports = 0-65535
exclude-ports = 0
ports-per-probe = 0

# Timing options (in milliseconds)
retries = 0
wait = 2

# Output
output-file = masscan-results.txt
output-format = list

# Network interface
interface = eth0

# Verbosity
verbosity = 3

# Probe options
ping = false

# Source options (advanced)
source-port = 40000
source-ip = 0.0.0.0